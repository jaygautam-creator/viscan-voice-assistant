name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check app tests scripts
          uv run ruff format --check app tests scripts

      - name: Tests
        run: uv run pytest

      - name: Conversation evals (rules engine)
        run: uv run python scripts/run_evals.py
        env:
          VISCAN_AUDIT_LOG: ""
